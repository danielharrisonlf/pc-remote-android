plugins { id 'com.android.application' }

def releaseKeystorePath = System.getenv("PCREMOTE_KEYSTORE_PATH")
def releaseKeyAlias = System.getenv("PCREMOTE_KEY_ALIAS")
def releaseStorePassword = System.getenv("PCREMOTE_STORE_PASSWORD")
def releaseKeyPassword = System.getenv("PCREMOTE_KEY_PASSWORD")
def hasReleaseSigning = releaseKeystorePath && releaseKeyAlias && releaseStorePassword && releaseKeyPassword

android {
    namespace 'com.pcremote'
    compileSdk 37
    buildToolsVersion '37.0.0'
    defaultConfig {
        applicationId 'com.pcremote.nativeandroid'
        minSdk 24
        targetSdk 36
        versionCode 602
        versionName '0.6.2-kotlin'
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        sizeBaseline {
            initWith release
            minifyEnabled false
            shrinkResources false
            matchingFallbacks = ['release']
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
