name: Kotlin Android checks and APK
on:
  push:
    branches: [native/kotlin]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Tests, lint and universal evaluation APK
        working-directory: android
        run: bash gradlew testDebugUnitTest lintRelease assembleRelease
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pc-remote-android-kotlin-evaluation
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
